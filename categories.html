<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — NOVA Store</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-container"></div>
<main>
<section class="page-header">
  <div class="container-xxl">
    <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active">Categories</li></ol></nav>
    <h1 class="h2 fw-bold mt-3">All Categories</h1>
    <p class="text-muted">Browse our wide range of product categories</p>
  </div>
</section>

<section class="section-pad">
  <div class="container-xxl">
    <!-- Category Hero Cards -->
    <div class="row g-4 mb-5" id="catHeroGrid"></div>

    <!-- Products per category -->
    <div id="catSections"></div>
  </div>
</section>
</main>
<div id="footer-container"></div>
<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9998"></div>
<button id="backToTop" class="btn btn-primary position-fixed" style="bottom:88px;right:24px;display:none;z-index:9990"><i class="fas fa-arrow-up"></i></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/auth.js"></script><script src="js/cart.js"></script><script src="js/app.js"></script>
<script>
const CAT_IMAGES = {
  electronics: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=600&h=300&fit=crop',
  shoes:        'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&h=300&fit=crop',
  fashion:      'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600&h=300&fit=crop',
  watches:      'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&h=300&fit=crop',
  'home-decor': 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600&h=300&fit=crop',
  beauty:       'https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?w=600&h=300&fit=crop',
  accessories:  'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600&h=300&fit=crop',
};

document.addEventListener('DOMContentLoaded', () => {
  // Hero grid
  document.getElementById('catHeroGrid').innerHTML = CATEGORIES.map((c, i) => `
    <div class="col-sm-6 col-lg-4 ${i===0?'col-lg-8':''}" data-aos>
      <a href="products.html?category=${c.id}" class="d-block position-relative rounded-3 overflow-hidden hover-lift text-decoration-none" style="height:${i===0?240:180}px">
        <img src="${CAT_IMAGES[c.id]}" alt="${c.name}" class="w-100 h-100" style="object-fit:cover;transition:transform 0.5s ease">
        <div class="position-absolute inset-0 d-flex flex-column justify-content-end p-4" style="inset:0;background:linear-gradient(to top,rgba(0,0,0,0.7) 0%,transparent 100%)">
          <div class="d-flex align-items-center gap-3">
            <div class="cat-icon" style="background:${c.bg};color:${c.color};width:44px;height:44px;font-size:1.1rem"><i class="fas ${c.icon}"></i></div>
            <div>
              <h5 class="fw-bold text-white mb-0">${c.name}</h5>
              <span class="small" style="color:rgba(255,255,255,0.7)">${c.count} products</span>
            </div>
          </div>
        </div>
      </a>
    </div>`).join('');

  // Per-category product sections
  document.getElementById('catSections').innerHTML = CATEGORIES.map(c => {
    const prods = getProductsByCategory(c.id).slice(0,4);
    return `
    <div class="mb-5" id="section-${c.id}" data-aos>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
          <div class="cat-icon" style="background:${c.bg};color:${c.color}"><i class="fas ${c.icon}"></i></div>
          <div>
            <h3 class="fw-bold mb-0">${c.name}</h3>
            <span class="text-muted small">${c.count} products</span>
          </div>
        </div>
        <a href="products.html?category=${c.id}" class="btn btn-outline-primary btn-sm">View All <i class="fas fa-arrow-right ms-1"></i></a>
      </div>
      <div class="products-grid">${prods.map(p => renderProductCard(p)).join('')}</div>
    </div>`;
  }).join('');

  setTimeout(initScrollReveal, 100);
});
</script>
</body>
</html>
