<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — NOVA Store</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-container"></div>
<main>
<section class="page-header">
  <div class="container-xxl">
    <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item"><a href="profile.html">Profile</a></li><li class="breadcrumb-item active">My Orders</li></ol></nav>
    <h1 class="h2 fw-bold mt-3">My Orders</h1>
  </div>
</section>
<section class="section-pad">
  <div class="container-xxl">
    <!-- Filter tabs -->
    <div class="d-flex gap-2 flex-wrap mb-4">
      <button class="btn btn-primary btn-sm" onclick="filterOrders('all')" id="filter-all">All Orders</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="filterOrders('processing')" id="filter-processing">Processing</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="filterOrders('shipped')" id="filter-shipped">Shipped</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="filterOrders('delivered')" id="filter-delivered">Delivered</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="filterOrders('cancelled')" id="filter-cancelled">Cancelled</button>
    </div>

    <div id="emptyOrders" class="text-center py-5 d-none">
      <div style="font-size:5rem">📦</div>
      <h3 class="fw-bold mt-3 mb-2">No orders found</h3>
      <p class="text-muted mb-4">You haven't placed any orders yet.</p>
      <a href="products.html" class="btn btn-primary btn-lg px-5">Start Shopping</a>
    </div>

    <div id="ordersList" class="d-flex flex-column gap-4"></div>
  </div>
</section>

<!-- Order Detail Modal -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content nova-modal">
      <div class="modal-header border-0">
        <h5 class="modal-title">Order Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="orderModalBody"></div>
      <div class="modal-footer border-0">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        <button class="btn btn-primary" onclick="printCurrentOrder()"><i class="fas fa-print me-2"></i>Print Invoice</button>
      </div>
    </div>
  </div>
</div>
</main>
<div id="footer-container"></div>
<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9998"></div>
<button id="backToTop" class="btn btn-primary position-fixed" style="bottom:88px;right:24px;display:none;z-index:9990"><i class="fas fa-arrow-up"></i></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/auth.js"></script><script src="js/cart.js"></script><script src="js/app.js"></script>
<script>
requireLogin();
let currentOrderDetail = null;
let currentFilter = 'all';

function filterOrders(status) {
  currentFilter = status;
  document.querySelectorAll('[id^="filter-"]').forEach(b => {
    b.className = 'btn btn-outline-secondary btn-sm';
  });
  document.getElementById('filter-'+status).className = 'btn btn-primary btn-sm';
  renderOrders();
}

function renderOrders() {
  let orders = getUserOrders();
  if (currentFilter !== 'all') orders = orders.filter(o => o.status === currentFilter);
  if (!orders.length) {
    document.getElementById('emptyOrders').classList.remove('d-none');
    document.getElementById('ordersList').innerHTML = '';
    return;
  }
  document.getElementById('emptyOrders').classList.add('d-none');

  const statusSteps = { processing: 1, shipped: 2, delivered: 3, cancelled: 0 };

  document.getElementById('ordersList').innerHTML = orders.map(o => {
    const step = statusSteps[o.status] || 0;
    const cancelled = o.status === 'cancelled';
    return `
    <div class="order-card">
      <div class="order-header d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div>
          <div class="d-flex align-items-center gap-3 flex-wrap">
            <span class="fw-bold" style="color:var(--primary-light)">${o.id}</span>
            ${statusBadge(o.status)}
          </div>
          <div class="small text-muted mt-1">${formatDate(o.date)} · ${o.items.length} item${o.items.length!==1?'s':''} · Payment: <b>${o.payment.toUpperCase()}</b></div>
        </div>
        <div class="text-end">
          <div class="fw-bold fs-5" style="color:var(--primary-light)">${formatPrice(o.total)}</div>
          <button class="btn btn-sm btn-outline-primary mt-1" onclick="viewOrder('${o.id}')"><i class="fas fa-eye me-1"></i>Details</button>
        </div>
      </div>
      <div class="order-body">
        <!-- Items preview -->
        <div class="d-flex gap-3 mb-4 flex-wrap">
          ${o.items.slice(0,4).map(item => {
            const p = PRODUCTS.find(x=>x.id===item.productId);
            return `<div class="d-flex align-items-center gap-2">
              ${p ? `<img src="${p.image}" class="order-item-thumb" onerror="this.src='https://placehold.co/52x52/1a1a2e/7c3aed?text=N'">` : ''}
              <div class="small"><div class="fw-semibold" style="color:var(--text)">${item.name}</div><div class="text-muted">×${item.qty} · ${formatPrice(item.price)}</div></div>
            </div>`;
          }).join('')}
          ${o.items.length > 4 ? `<div class="d-flex align-items-center"><span class="text-muted small">+${o.items.length-4} more</span></div>` : ''}
        </div>
        <!-- Progress bar -->
        ${!cancelled ? `
        <div class="d-flex justify-content-between position-relative mb-1" style="padding:0 10%">
          ${['Order Placed','Shipped','Delivered'].map((s,i) => `
            <div class="text-center" style="z-index:1">
              <div class="mx-auto mb-1" style="width:28px;height:28px;border-radius:50%;background:${step>i?'var(--success)':step===i?'var(--primary)':'var(--card2)'};border:2px solid ${step>i?'var(--success)':step===i?'var(--primary)':'var(--border2)'};display:flex;align-items:center;justify-content:center">
                <i class="fas fa-${step>i?'check':'circle'}" style="color:${step>=i?'#fff':'var(--text3)'};font-size:0.65rem"></i>
              </div>
              <div style="font-size:0.7rem;color:${step>=i?'var(--text)':'var(--text3)'};font-weight:${step===i?700:400}">${s}</div>
            </div>`).join('')}
          <div class="position-absolute" style="top:14px;left:12%;right:12%;height:2px;background:var(--border2);z-index:0">
            <div style="height:100%;background:var(--success);width:${step===0?0:step===1?'50%':'100%'};transition:width 0.5s"></div>
          </div>
        </div>` : `<div class="text-center small text-danger"><i class="fas fa-ban me-1"></i>This order has been cancelled.</div>`}
        <!-- Actions -->
        <div class="d-flex gap-2 mt-3 flex-wrap justify-content-end">
          ${o.status !== 'cancelled' && o.status !== 'delivered' ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelOrder('${o.id}')">Cancel Order</button>` : ''}
          ${o.status === 'delivered' ? `<button class="btn btn-sm btn-outline-primary" onclick="reorder('${o.id}')"><i class="fas fa-redo me-1"></i>Reorder</button>` : ''}
          <button class="btn btn-sm btn-outline-secondary" onclick="viewOrder('${o.id}')"><i class="fas fa-file-invoice me-1"></i>Invoice</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function viewOrder(id) {
  const orders = getOrders();
  const o = orders.find(x=>x.id===id);
  if (!o) return;
  currentOrderDetail = o;
  document.getElementById('orderModalBody').innerHTML = `
    <div class="row g-3 mb-4">
      <div class="col-6"><div class="small text-muted">Order ID</div><div class="fw-bold" style="color:var(--primary-light)">${o.id}</div></div>
      <div class="col-6"><div class="small text-muted">Date</div><div class="fw-semibold">${formatDate(o.date)}</div></div>
      <div class="col-6"><div class="small text-muted">Status</div>${statusBadge(o.status)}</div>
      <div class="col-6"><div class="small text-muted">Payment</div><div class="fw-semibold">${o.payment.toUpperCase()}</div></div>
      <div class="col-12"><div class="small text-muted">Ship To</div><div class="fw-semibold">${o.address}</div></div>
    </div>
    <table class="table" style="font-size:0.87rem">
      <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
      <tbody>${o.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${formatPrice(i.price)}</td><td>${formatPrice(i.price*i.qty)}</td></tr>`).join('')}</tbody>
    </table>
    <div class="text-end">
      <div class="small text-muted">Subtotal: ${formatPrice(o.subtotal)}</div>
      <div class="small text-muted">Shipping: ${o.shipping===0?'FREE':formatPrice(o.shipping)}</div>
      <div class="small text-muted">Tax: ${formatPrice(o.tax)}</div>
      <div class="fw-bold mt-1" style="color:var(--primary-light)">Total: ${formatPrice(o.total)}</div>
    </div>`;
  new bootstrap.Modal(document.getElementById('orderModal')).show();
}

function cancelOrder(id) {
  if (!confirm('Cancel this order?')) return;
  updateOrderStatus(id, 'cancelled');
  showToast('Order cancelled.', 'info');
  renderOrders();
}

function reorder(id) {
  const orders = getOrders();
  const o = orders.find(x=>x.id===id);
  if (!o) return;
  o.items.forEach(item => {
    const p = PRODUCTS.find(x=>x.id===item.productId);
    if (p) addToCart(p, item.qty);
  });
  showToast('Items added to cart!', 'success');
}

function printCurrentOrder() {
  if (!currentOrderDetail) return;
  const o = currentOrderDetail;
  const w = window.open('','_blank');
  w.document.write(`<html><head><title>Invoice ${o.id}</title><style>body{font-family:Arial,sans-serif;padding:40px;max-width:600px;margin:0 auto}h1{color:#7c3aed}table{width:100%;border-collapse:collapse}td,th{padding:10px;border:1px solid #eee;text-align:left}</style></head><body>
    <h1>⚡ NOVA Store — Invoice</h1>
    <p><b>Order:</b> ${o.id} | <b>Date:</b> ${formatDate(o.date)} | <b>Status:</b> ${o.status}</p>
    <p><b>Ship to:</b> ${o.address}</p>
    <table><thead><tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead><tbody>
    ${o.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${formatPrice(i.price)}</td><td>${formatPrice(i.price*i.qty)}</td></tr>`).join('')}
    </tbody><tfoot>
    <tr><td colspan="3">Subtotal</td><td>${formatPrice(o.subtotal)}</td></tr>
    <tr><td colspan="3">Shipping</td><td>${formatPrice(o.shipping)}</td></tr>
    <tr><td colspan="3">Tax</td><td>${formatPrice(o.tax)}</td></tr>
    <tr><td colspan="3"><b>Total</b></td><td><b>${formatPrice(o.total)}</b></td></tr>
    </tfoot></table>
    <p style="margin-top:40px;color:#888;font-size:0.85em">Thank you for shopping with NOVA Store!</p>
    </body></html>`);
  w.document.close(); w.print();
}

document.addEventListener('DOMContentLoaded', renderOrders);
</script>
</body>
</html>
