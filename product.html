<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — NOVA Store</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-container"></div>
<main>

<section class="section-pad">
  <div class="container-xxl">
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item"><a href="products.html">Products</a></li>
        <li class="breadcrumb-item active" id="breadcrumbName">Loading…</li>
      </ol>
    </nav>

    <div id="productContent" class="d-none">
      <div class="row g-5">
        <!-- Gallery -->
        <div class="col-lg-5">
          <div class="product-gallery-main mb-3" id="mainImg">
            <img id="mainImage" src="" alt="" style="width:100%;height:100%;object-fit:cover">
          </div>
          <div class="row g-2" id="thumbs"></div>
        </div>

        <!-- Details -->
        <div class="col-lg-7">
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="badge px-3 py-2" style="background:rgba(124,58,237,0.2);color:var(--primary-light)" id="prodCategory"></span>
            <span id="prodBadge"></span>
          </div>
          <h1 class="fw-bold mb-2" id="prodName"></h1>
          <div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
            <div id="prodStars"></div>
            <span class="text-muted small" id="prodReviews"></span>
            <span class="text-muted small">|</span>
            <span class="small" id="prodBrand"></span>
          </div>
          <div class="d-flex align-items-baseline gap-3 mb-4">
            <span style="font-size:2.2rem;font-weight:900;color:var(--primary-light)" id="prodPrice"></span>
            <span class="text-muted text-decoration-line-through fs-5" id="prodOldPrice"></span>
            <span class="badge bg-danger" id="prodDiscount"></span>
          </div>
          <p class="text-muted mb-4" id="prodDesc"></p>

          <!-- Tags -->
          <div class="d-flex flex-wrap gap-2 mb-4" id="prodTags"></div>

          <!-- Stock -->
          <div class="mb-4" id="prodStock"></div>

          <!-- Quantity & Cart -->
          <div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
            <div class="quantity-control">
              <button class="qty-btn" onclick="changeQty(-1)">−</button>
              <input type="number" class="qty-val" id="qtyInput" value="1" min="1" readonly>
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <button class="btn btn-primary px-5 py-3 flex-fill" style="max-width:260px" id="addCartBtn">
              <i class="fas fa-cart-plus me-2"></i>Add to Cart
            </button>
            <button class="btn btn-icon" style="width:48px;height:48px" id="wishlistBtn" onclick="handleProductWishlist()">
              <i class="far fa-heart" id="wishlistIcon"></i>
            </button>
          </div>

          <!-- Buy Now -->
          <div class="d-flex gap-3 mb-5">
            <button class="btn btn-outline-primary flex-fill py-3" onclick="buyNow()">
              <i class="fas fa-bolt me-2"></i>Buy Now
            </button>
            <button class="btn btn-outline-secondary" onclick="shareProduct()">
              <i class="fas fa-share-alt"></i>
            </button>
          </div>

          <!-- Delivery info -->
          <div class="nova-card p-4">
            <div class="row g-3">
              <div class="col-6">
                <div class="d-flex gap-3 align-items-start">
                  <i class="fas fa-shipping-fast mt-1" style="color:var(--primary-light)"></i>
                  <div><div class="fw-semibold small">Free Delivery</div><div class="text-muted" style="font-size:0.78rem">On orders over $100</div></div>
                </div>
              </div>
              <div class="col-6">
                <div class="d-flex gap-3 align-items-start">
                  <i class="fas fa-undo mt-1" style="color:var(--success)"></i>
                  <div><div class="fw-semibold small">30 Day Returns</div><div class="text-muted" style="font-size:0.78rem">Hassle-free returns</div></div>
                </div>
              </div>
              <div class="col-6">
                <div class="d-flex gap-3 align-items-start">
                  <i class="fas fa-shield-alt mt-1" style="color:var(--accent)"></i>
                  <div><div class="fw-semibold small">Secure Payment</div><div class="text-muted" style="font-size:0.78rem">256-bit SSL</div></div>
                </div>
              </div>
              <div class="col-6">
                <div class="d-flex gap-3 align-items-start">
                  <i class="fas fa-award mt-1" style="color:var(--accent2)"></i>
                  <div><div class="fw-semibold small">Genuine Product</div><div class="text-muted" style="font-size:0.78rem">100% authentic</div></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabs: Description / Reviews -->
      <div class="mt-5">
        <ul class="nav nav-tabs" id="prodTabs">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabDesc">Description</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabReviews">Reviews <span id="reviewCountBadge" class="badge ms-1" style="background:var(--primary)"></span></button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabSpecs">Specifications</button></li>
        </ul>
        <div class="tab-content">
          <div class="tab-pane fade show active" id="tabDesc">
            <p id="fullDesc" class="mb-0" style="line-height:1.8"></p>
          </div>
          <div class="tab-pane fade" id="tabReviews">
            <div class="row g-4 mb-4">
              <div class="col-md-3 text-center">
                <div style="font-size:4rem;font-weight:900;color:var(--primary-light)" id="avgRating"></div>
                <div id="avgStars" class="my-2"></div>
                <div class="text-muted small" id="totalReviews"></div>
              </div>
              <div class="col-md-9" id="ratingBars"></div>
            </div>
            <div id="reviewsList"></div>
            <!-- Write Review -->
            <div class="nova-card p-4 mt-4">
              <h6 class="fw-bold mb-3">Write a Review</h6>
              <div class="star-rating mb-3">
                <input type="radio" name="rev-star" id="s5" value="5"><label for="s5"><i class="fas fa-star"></i></label>
                <input type="radio" name="rev-star" id="s4" value="4"><label for="s4"><i class="fas fa-star"></i></label>
                <input type="radio" name="rev-star" id="s3" value="3"><label for="s3"><i class="fas fa-star"></i></label>
                <input type="radio" name="rev-star" id="s2" value="2"><label for="s2"><i class="fas fa-star"></i></label>
                <input type="radio" name="rev-star" id="s1" value="1"><label for="s1"><i class="fas fa-star"></i></label>
              </div>
              <textarea class="form-control mb-3" id="reviewText" rows="3" placeholder="Share your experience..."></textarea>
              <button class="btn btn-primary" onclick="submitReview()"><i class="fas fa-paper-plane me-2"></i>Submit Review</button>
            </div>
          </div>
          <div class="tab-pane fade" id="tabSpecs">
            <table class="table" id="specsTable"></table>
          </div>
        </div>
      </div>

      <!-- Related Products -->
      <div class="mt-5">
        <h4 class="fw-bold mb-4">You Might Also Like</h4>
        <div class="products-grid" id="relatedGrid"></div>
      </div>
    </div>

    <!-- Skeleton -->
    <div id="productSkeleton">
      <div class="row g-5">
        <div class="col-lg-5"><div class="skeleton skeleton-img" style="height:400px;border-radius:var(--radius-xl)"></div></div>
        <div class="col-lg-7">
          <div class="skeleton skeleton-text w-40 mb-3"></div>
          <div class="skeleton skeleton-text w-80 mb-2" style="height:32px"></div>
          <div class="skeleton skeleton-text w-60 mb-4"></div>
          <div class="skeleton skeleton-text w-40 mb-4" style="height:24px"></div>
          <div class="skeleton skeleton-text w-100 mb-2"></div>
          <div class="skeleton skeleton-text w-100 mb-2"></div>
          <div class="skeleton skeleton-text w-80"></div>
        </div>
      </div>
    </div>
  </div>
</section>
</main>

<div id="footer-container"></div>
<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9998"></div>
<button id="backToTop" class="btn btn-primary position-fixed" style="bottom:88px;right:24px;display:none;z-index:9990"><i class="fas fa-arrow-up"></i></button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/auth.js"></script><script src="js/cart.js"></script><script src="js/app.js"></script>
<script>
let currentProduct = null;
const FAKE_REVIEWS = [
  { name:'Alex M.', avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=alex2', rating:5, date:'Dec 2024', text:'Absolutely incredible product. Exceeded all expectations. Fast delivery and perfect packaging.' },
  { name:'Jamie L.', avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=jamie', rating:4, date:'Nov 2024', text:'Great quality for the price. Would definitely buy again. Minor packaging issue but product itself is flawless.' },
  { name:'Sam K.', avatar:'https://api.dicebear.com/7.x/avataaars/svg?seed=samk', rating:5, date:'Oct 2024', text:'This is my second purchase from NOVA Store and both times have been excellent. Highly recommended!' },
];

function loadProduct() {
  const id = getParam('id');
  if (!id) { window.location.href = 'products.html'; return; }
  setTimeout(() => {
    const p = getProduct(parseInt(id));
    if (!p) { window.location.href = '404.html'; return; }
    currentProduct = p;
    addRecentlyViewed(p.id);
    renderProduct(p);
    document.title = p.name + ' — NOVA Store';
  }, 300);
}

function renderProduct(p) {
  document.getElementById('productSkeleton').style.display = 'none';
  document.getElementById('productContent').classList.remove('d-none');

  document.getElementById('breadcrumbName').textContent = p.name;
  document.getElementById('prodName').textContent = p.name;
  document.getElementById('prodCategory').textContent = CATEGORIES.find(c=>c.id===p.category)?.name || p.category;
  document.getElementById('prodBrand').innerHTML = `<span class="badge" style="background:var(--card2);border:1px solid var(--border2);color:var(--text2)">${p.brand}</span>`;
  document.getElementById('prodStars').innerHTML = renderStars(p.rating);
  document.getElementById('prodReviews').textContent = `${p.reviews.toLocaleString()} reviews`;
  document.getElementById('prodPrice').textContent = formatPrice(p.price);
  if (p.oldPrice) {
    document.getElementById('prodOldPrice').textContent = formatPrice(p.oldPrice);
    const disc = Math.round((1-p.price/p.oldPrice)*100);
    document.getElementById('prodDiscount').textContent = disc + '% OFF';
  }
  document.getElementById('prodDesc').textContent = p.description;
  document.getElementById('fullDesc').textContent = p.description + ' This product is backed by our 30-day return guarantee and 1-year warranty. Ships within 1-2 business days.';

  // Badge
  if (p.badge) {
    document.getElementById('prodBadge').innerHTML = `<span class="badge product-badge badge-${slugify(p.badge)}">${p.badge}</span>`;
  }

  // Tags
  document.getElementById('prodTags').innerHTML = p.tags.map(t => `<span class="badge" style="background:var(--card2);border:1px solid var(--border2);color:var(--text3)">#${t}</span>`).join('');

  // Stock
  const stockEl = document.getElementById('prodStock');
  if (p.stock > 10) stockEl.innerHTML = `<span class="badge bg-success"><i class="fas fa-check me-1"></i>In Stock (${p.stock} available)</span>`;
  else if (p.stock > 0) stockEl.innerHTML = `<span class="badge bg-warning text-dark"><i class="fas fa-exclamation-triangle me-1"></i>Low Stock — Only ${p.stock} left!</span>`;
  else stockEl.innerHTML = `<span class="badge bg-danger">Out of Stock</span>`;

  // Gallery
  document.getElementById('mainImage').src = p.image;
  document.getElementById('mainImage').alt = p.name;
  const imgs = p.images || [p.image];
  document.getElementById('thumbs').innerHTML = imgs.map((img, i) => `
    <div class="col-3"><div class="thumb-img ${i===0?'active':''}" onclick="switchImg('${img}', this)">
      <img src="${img}" alt="" onerror="this.src='https://placehold.co/200x200/1a1a2e/7c3aed?text=NOVA'">
    </div></div>`).join('');

  // Cart btn
  document.getElementById('addCartBtn').onclick = () => {
    const qty = parseInt(document.getElementById('qtyInput').value);
    addToCart(p, qty);
  };

  // Wishlist
  updateWishlistIcon();

  // Reviews tab
  document.getElementById('reviewCountBadge').textContent = FAKE_REVIEWS.length;
  document.getElementById('avgRating').textContent = p.rating;
  document.getElementById('avgStars').innerHTML = renderStars(p.rating);
  document.getElementById('totalReviews').textContent = p.reviews.toLocaleString() + ' reviews';
  const bars = [5,4,3,2,1].map(s => {
    const pct = s === Math.round(p.rating) ? 60 : s === Math.ceil(p.rating) ? 25 : s === Math.floor(p.rating) ? 30 : s > p.rating ? 5 : 10;
    return `<div class="d-flex align-items-center gap-2 mb-1">
      <span class="small text-muted" style="width:20px">${s}★</span>
      <div class="progress flex-fill" style="height:6px"><div class="progress-bar" style="width:${pct}%"></div></div>
      <span class="small text-muted" style="width:32px">${pct}%</span>
    </div>`;
  }).join('');
  document.getElementById('ratingBars').innerHTML = bars;
  document.getElementById('reviewsList').innerHTML = FAKE_REVIEWS.map(r => `
    <div class="nova-card p-4 mb-3">
      <div class="d-flex align-items-center gap-3 mb-2">
        <img src="${r.avatar}" class="rounded-circle" width="38" height="38">
        <div><div class="fw-semibold small">${r.name}</div><div class="text-muted" style="font-size:0.75rem">${r.date}</div></div>
        <div class="ms-auto">${renderStars(r.rating)}</div>
      </div>
      <p class="text-muted small mb-0">${r.text}</p>
    </div>`).join('');

  // Specs
  const specs = [
    ['Brand', p.brand], ['Category', CATEGORIES.find(c=>c.id===p.category)?.name], ['Rating', p.rating + '/5'],
    ['In Stock', p.stock + ' units'], ['Tags', p.tags.join(', ')]
  ];
  document.getElementById('specsTable').innerHTML = specs.map(([k,v]) => `<tr><th style="width:40%;color:var(--text3);font-weight:600;font-size:0.85rem;border-color:var(--border)">${k}</th><td style="border-color:var(--border);color:var(--text2);font-size:0.87rem">${v}</td></tr>`).join('');

  // Related
  const related = getRelatedProducts(p, 4);
  document.getElementById('relatedGrid').innerHTML = related.map(rp => renderProductCard(rp)).join('');
  setTimeout(initScrollReveal, 100);
}

function switchImg(src, el) {
  document.getElementById('mainImage').src = src;
  document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}
function changeQty(d) {
  const inp = document.getElementById('qtyInput');
  const max = currentProduct?.stock || 99;
  inp.value = Math.min(max, Math.max(1, parseInt(inp.value) + d));
}
function updateWishlistIcon() {
  if (!currentProduct) return;
  const inWL = isInWishlist(currentProduct.id);
  document.getElementById('wishlistIcon').className = inWL ? 'fas fa-heart' : 'far fa-heart';
  document.getElementById('wishlistIcon').style.color = inWL ? '#ef4444' : '';
}
function handleProductWishlist() {
  if (!currentProduct) return;
  toggleWishlist(currentProduct);
  updateWishlistIcon();
  updateWishlistBadge();
}
function buyNow() {
  if (!currentProduct) return;
  const qty = parseInt(document.getElementById('qtyInput').value);
  addToCart(currentProduct, qty);
  window.location.href = 'checkout.html';
}
function shareProduct() {
  if (navigator.share) { navigator.share({ title: currentProduct?.name, url: window.location.href }); }
  else { navigator.clipboard.writeText(window.location.href).then(() => showToast('Link copied to clipboard!', 'success')); }
}
function submitReview() {
  const star = document.querySelector('input[name="rev-star"]:checked');
  const text = document.getElementById('reviewText').value.trim();
  if (!star) { showToast('Please select a star rating.', 'warning'); return; }
  if (!text) { showToast('Please write your review.', 'warning'); return; }
  showToast('Thank you for your review! 🎉', 'success');
  document.getElementById('reviewText').value = '';
}

document.addEventListener('DOMContentLoaded', loadProduct);
</script>
</body>
</html>
