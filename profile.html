<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — NOVA Store</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-container"></div>
<main>
<section class="page-header">
  <div class="container-xxl">
    <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active">My Profile</li></ol></nav>
    <h1 class="h2 fw-bold mt-3">My Profile</h1>
  </div>
</section>
<section class="section-pad">
  <div class="container-xxl">
    <div class="row g-4">
      <!-- Left sidebar -->
      <div class="col-lg-3">
        <div class="nova-card p-4 text-center mb-3">
          <div class="profile-avatar-wrap mx-auto mb-3">
            <img id="profileAvatar" src="" alt="Avatar" class="profile-avatar">
            <div class="avatar-edit"><i class="fas fa-camera"></i></div>
          </div>
          <h5 class="fw-bold mb-0" id="profileName">—</h5>
          <div class="text-muted small mb-2" id="profileEmail">—</div>
          <span class="badge px-3 py-2" id="profileRole" style="background:rgba(124,58,237,0.2);color:var(--primary-light)"></span>
          <div class="mt-3 pt-3 border-top" style="border-color:var(--border)!important">
            <div class="d-flex justify-content-around text-center">
              <div><div class="fw-bold" id="sideOrderCount">0</div><div class="text-muted small">Orders</div></div>
              <div><div class="fw-bold" id="sideWishCount">0</div><div class="text-muted small">Wishlist</div></div>
              <div><div class="fw-bold" id="sideCartCount">0</div><div class="text-muted small">Cart</div></div>
            </div>
          </div>
        </div>
        <div class="nova-card p-2">
          <a class="nav-link rounded-2 p-3 mb-1 active" href="#" onclick="showTab('info');return false" id="tab-info" style="display:flex;align-items:center;gap:10px;font-size:0.87rem"><i class="fas fa-user" style="width:18px;text-align:center"></i>Personal Info</a>
          <a class="nav-link rounded-2 p-3 mb-1" href="#" onclick="showTab('security');return false" id="tab-security" style="display:flex;align-items:center;gap:10px;font-size:0.87rem"><i class="fas fa-shield-alt" style="width:18px;text-align:center"></i>Security</a>
          <a class="nav-link rounded-2 p-3 mb-1" href="orders.html" style="display:flex;align-items:center;gap:10px;font-size:0.87rem;color:var(--text2)"><i class="fas fa-box" style="width:18px;text-align:center"></i>My Orders</a>
          <a class="nav-link rounded-2 p-3 mb-1" href="wishlist.html" style="display:flex;align-items:center;gap:10px;font-size:0.87rem;color:var(--text2)"><i class="fas fa-heart" style="width:18px;text-align:center"></i>Wishlist</a>
          <hr style="border-color:var(--border);margin:4px 8px">
          <button class="nav-link rounded-2 p-3 w-100 text-start" onclick="logout()" style="display:flex;align-items:center;gap:10px;font-size:0.87rem;color:var(--danger);background:none;border:none"><i class="fas fa-sign-out-alt" style="width:18px;text-align:center"></i>Logout</button>
        </div>
      </div>

      <!-- Right content -->
      <div class="col-lg-9">
        <!-- Personal Info -->
        <div id="panelInfo">
          <div class="nova-card p-4 mb-4">
            <h5 class="fw-bold mb-4"><i class="fas fa-user me-2" style="color:var(--primary-light)"></i>Personal Information</h5>
            <form onsubmit="saveProfile(event)">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-control" id="editName" placeholder="Your name">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email Address</label>
                  <input type="email" class="form-control" id="editEmail" placeholder="Your email" readonly style="opacity:0.6">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="tel" class="form-control" id="editPhone" placeholder="+1 (555) 000-0000">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Member Since</label>
                  <input type="text" class="form-control" id="editJoined" readonly style="opacity:0.6">
                </div>
                <div class="col-12">
                  <label class="form-label">Default Address</label>
                  <textarea class="form-control" id="editAddress" rows="2" placeholder="Your shipping address"></textarea>
                </div>
              </div>
              <button type="submit" class="btn btn-primary mt-4 px-5"><i class="fas fa-save me-2"></i>Save Changes</button>
            </form>
          </div>

          <!-- Recent Orders preview -->
          <div class="nova-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0"><i class="fas fa-box me-2" style="color:var(--primary-light)"></i>Recent Orders</h5>
              <a href="orders.html" class="btn btn-sm btn-outline-primary">View All</a>
            </div>
            <div id="recentOrdersPreview"></div>
          </div>
        </div>

        <!-- Security panel -->
        <div id="panelSecurity" class="d-none">
          <div class="nova-card p-4 mb-4">
            <h5 class="fw-bold mb-4"><i class="fas fa-shield-alt me-2" style="color:var(--primary-light)"></i>Change Password</h5>
            <form onsubmit="changePassword(event)">
              <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-control" id="oldPwd" placeholder="••••••••">
              </div>
              <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPwd" placeholder="Min. 6 characters" minlength="6">
              </div>
              <div class="mb-4">
                <label class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" id="confPwd" placeholder="Re-enter new password">
              </div>
              <button type="submit" class="btn btn-primary px-5"><i class="fas fa-key me-2"></i>Update Password</button>
            </form>
          </div>
          <div class="nova-card p-4">
            <h5 class="fw-bold mb-3 text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Danger Zone</h5>
            <p class="text-muted small mb-3">This will permanently delete your account and all associated data.</p>
            <button class="btn btn-outline-danger" onclick="showToast('Account deletion is disabled in demo mode.','warning')"><i class="fas fa-trash me-2"></i>Delete Account</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</main>
<div id="footer-container"></div>
<div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index:9998"></div>
<button id="backToTop" class="btn btn-primary position-fixed" style="bottom:88px;right:24px;display:none;z-index:9990"><i class="fas fa-arrow-up"></i></button>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/auth.js"></script><script src="js/cart.js"></script><script src="js/app.js"></script>
<script>
requireLogin();

function loadProfile() {
  const user = getCurrentUser();
  if (!user) return;
  document.getElementById('profileAvatar').src = user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.id}`;
  document.getElementById('profileName').textContent = user.name;
  document.getElementById('profileEmail').textContent = user.email;
  document.getElementById('profileRole').textContent = user.role === 'admin' ? '👑 Admin' : '🛍️ Member';
  document.getElementById('sideOrderCount').textContent = getUserOrders().length;
  document.getElementById('sideWishCount').textContent = getWishlist().length;
  document.getElementById('sideCartCount').textContent = getCartCount();
  document.getElementById('editName').value = user.name;
  document.getElementById('editEmail').value = user.email;
  document.getElementById('editPhone').value = user.phone || '';
  document.getElementById('editAddress').value = user.address || '';
  document.getElementById('editJoined').value = user.joined ? formatDate(user.joined) : '—';
  const orders = getUserOrders().slice(0,3);
  if (!orders.length) {
    document.getElementById('recentOrdersPreview').innerHTML = '<p class="text-muted small">No orders yet.</p>';
    return;
  }
  document.getElementById('recentOrdersPreview').innerHTML = orders.map(o => `
    <div class="d-flex align-items-center justify-content-between py-2 border-bottom" style="border-color:var(--border)!important">
      <div>
        <div class="small fw-semibold">${o.id}</div>
        <div class="small text-muted">${formatDate(o.date)} · ${o.items.length} item${o.items.length!==1?'s':''}</div>
      </div>
      <div class="d-flex align-items-center gap-3">
        ${statusBadge(o.status)}
        <span class="fw-bold small" style="color:var(--primary-light)">${formatPrice(o.total)}</span>
      </div>
    </div>`).join('');
}

function showTab(tab) {
  ['info','security'].forEach(t => {
    document.getElementById('panel'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('d-none', t!==tab);
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('tab-'+t).style.background = t===tab ? 'rgba(124,58,237,0.15)' : '';
    document.getElementById('tab-'+t).style.color = t===tab ? 'var(--primary-light)' : '';
  });
}

function saveProfile(e) {
  e.preventDefault();
  const ok = updateProfile({ name: document.getElementById('editName').value.trim(), phone: document.getElementById('editPhone').value.trim(), address: document.getElementById('editAddress').value.trim() });
  if (ok) { showToast('Profile updated successfully! ✅', 'success'); loadProfile(); }
  else showToast('Failed to update profile.', 'danger');
}

function changePassword(e) {
  e.preventDefault();
  const newPwd = document.getElementById('newPwd').value;
  const conf = document.getElementById('confPwd').value;
  if (newPwd !== conf) { showToast('Passwords do not match.', 'warning'); return; }
  showToast('Password updated successfully! 🔒', 'success');
}

document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
